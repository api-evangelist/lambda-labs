                type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  error:
                    anyOf:
                    - $ref: '#/components/schemas/ApiErrorTicketNotFound'
                    - $ref: '#/components/schemas/ApiErrorResourceNotFound'
                required:
                - error
                type: object
