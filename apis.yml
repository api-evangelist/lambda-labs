apis:
- aid: lambda-labs:cloud-api
  name: Lambda Cloud API
  description: >-
    The Lambda Cloud API is the REST control plane for launching, listing, starting, stopping, and terminating
    GPU instances, managing SSH keys, firewalls, filesystems, images, and instance types. It supports
    on-demand single instances and underpins programmatic access to Lambda's GPU fleet.
  humanURL: https://docs.lambda.ai/api/cloud
  baseURL: https://cloud.lambda.ai/api/v1
