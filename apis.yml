- aid: lambda-labs:1-click-clusters
  name: Lambda 1-Click Clusters
  description: >-
    Lambda 1-Click Clusters provision interconnected clusters of 16 to 2,000+ NVIDIA H100 SXM or B200
    GPUs for short-duration distributed training workloads. The product is exposed through the Lambda
    Cloud console and is integrated with the Cloud API surface.
  humanURL: https://docs.lambda.ai/public-cloud/1-click-clusters/
